<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Predicción de Cultivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f9f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }
    .btn-custom {
      background: #28a745;
      color: white;
      font-weight: bold;
    }
    .btn-custom:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card p-4">
          <h3 class="text-center mb-4">Formulario de Predicción de Cultivos</h3>
          <form id="cropForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Nitrógeno</label>
                <input type="number" class="form-control" name="nitrogen" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Fósforo</label>
                <input type="number" class="form-control" name="phosphorus" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Potasio</label>
                <input type="number" class="form-control" name="potassium" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Temperatura (°C)</label>
                <input type="number" step="0.1" class="form-control" name="temperature" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Humedad (%)</label>
                <input type="number" step="0.1" class="form-control" name="humidity" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">pH</label>
                <input type="number" step="0.1" class="form-control" name="ph" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Precipitación (mm)</label>
                <input type="number" step="0.1" class="form-control" name="rainfall" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Modelo</label>
                <input type="number" step="1" max="1" min="0" class="form-control" name="model" required>
              </div>
            </div>
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-custom px-5">Predicción</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resultModalLabel">Resultado de la Predicción</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center">
          <h4 id="predictionResult"></h4>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("cropForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      // Convertir tipos numéricos
      ["nitrogen","phosphorus","potassium","model"].forEach(k => data[k] = parseInt(data[k]));
      ["temperature","humidity","ph","rainfall"].forEach(k => data[k] = parseFloat(data[k]));

      try {
        const response = await fetch("https://croprecomendationapi.onrender.com/api/v1/crop/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error("Error en la petición");

        const result = await response.json();
        document.getElementById("predictionResult").innerText = result.prediction;

        const modal = new bootstrap.Modal(document.getElementById("resultModal"));
        modal.show();
      } catch (error) {
        alert("Hubo un error: " + error.message);
      }
    });
  </script>
</body>
</html>
